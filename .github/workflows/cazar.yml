# Cazador de Ofertas GT — automatización en GitHub Actions.
# Corre en la nube (sin la PC encendida). Cron en UTC (Guatemala = UTC-6).
name: Cazar ofertas

on:
  schedule:
    # Cada hora de 6:00 a 23:59 hora GT (12:00-23:59 y 00:00-05:59 UTC)
    - cron: "0 12-23,0-5 * * *"
    # Madrugada: 00:00 y 03:00 hora GT (cada 3 h)
    - cron: "0 6,9 * * *"
  push:
    branches: [main]
    paths:
      - "web/**"   # publicar arreglos de la web al momento
  workflow_dispatch: {}   # para correrlo a mano desde la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cazar
  cancel-in-progress: false

jobs:
  cazar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas obligatorias (si fallan, no se publica)
        run: python -m unittest pruebas.test_motor pruebas.test_recolectores_nuevos

      - name: Recolectar, historial y puntaje
        run: python -m motor.pipeline

      - name: Enviar alertas por Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        run: python alertas/enviar.py

      - name: Guardar datos (commit de historial y web)
        run: |
          git config user.name "cazador-gt-bot"
          git config user.email "cazador-gt-bot@users.noreply.github.com"
          git add -A data web
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "actualizar ofertas y historial"
            git pull --rebase origin HEAD || true
            git push origin HEAD:main
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir web a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Publicar Pages
        uses: actions/deploy-pages@v4
